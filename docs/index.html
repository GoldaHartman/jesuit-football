<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Jesuit Football</title>
<meta name="description" content="Day-by-day schedule, practice times, and game-time notes for your class — Jesuit High School New Orleans football, 2026 season.">
<!-- Photos of minors: open to anyone with the link, closed to search engines. -->
<meta name="robots" content="noindex, nofollow, noimageindex">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=22bf8baa1e53">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jesuit FB">
<meta name="theme-color" content="#0a2450">
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="gate-inner">
    <div class="gate-mark">🏈</div>
    <h1 id="gate-title">Blue Jay Football</h1>
    <p id="gate-prompt">Enter the code from your grade mom.</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-code" type="text" inputmode="text" autocapitalize="none"
             spellcheck="false" placeholder="JAYS-••••••-26" aria-label="Access code">
      <button type="submit">Go Jays</button>
    </form>
    <p id="gate-error" class="gate-error" hidden>That code isn't right. Check with your grade mom.</p>
    <p id="gate-hint" class="gate-hint"></p>
  </div>
</div>

<header class="app">
  <div class="wordmark">
    <h1>Jesuit Football</h1>
    <span class="season">2026 · BLUE JAYS</span>
  </div>
  <div class="motto">Men of Faith and Men for Others</div>
</header>

<main>
  <section id="view-today"    class="view active"></section>
  <section id="view-schedule" class="view"></section>
  <section id="view-game"     class="view"></section>
  <section id="view-calendar" class="view"></section>
  <section id="view-grade"    class="view"></section>
  <section id="view-news"     class="view"></section>
  <section id="view-more"     class="view"></section>
  <section id="view-photos"   class="view"></section>
  <section id="view-info"     class="view"></section>
</main>

<nav class="tabs">
  <button data-view="today"    class="on"><span class="ico">📅</span>Today</button>
  <button data-view="schedule"><span class="ico">🏈</span>Games</button>
  <button data-view="calendar"><span class="ico">🗓️</span>Calendar</button>
  <button data-view="news"><span class="ico">📰</span>News</button>
  <button data-view="more"><span class="ico">☰</span>More</button>
</nav>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" aria-label="Close">✕</button>
  <img alt="Photo from the season">
</div>

<div id="daysheet" class="sheet" hidden>
  <div class="sheet-panel">
    <button class="sheet-close" aria-label="Close">✕</button>
    <div class="sheet-body"></div>
  </div>
</div>

<script src="data.js?v=22bf8baa1e53"></script>
<script src="app.js?v=22bf8baa1e53"></script>
</body>
</html>
